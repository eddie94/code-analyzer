[project]
name = "codemap"
version = "0.1.0"
description = "Static structure analyzer and visualizer for Python repositories"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "typer>=0.12",
    "pathspec>=0.12",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
codemap = "codemap.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codemap"]
# Built by `npm run build` in viewer/; gitignored but shipped in the wheel.
artifacts = ["src/codemap/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.codemap]
source_roots = ["src"]
exclude = ["tests/fixtures/**"]
